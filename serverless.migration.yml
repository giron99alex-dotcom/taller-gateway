# Transicion del Develop existente: ver README.md antes de usar.

service: taller-gateway
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'develop'}
  region: us-east-2
  environment:
    STAGE: ${self:provider.stage}
    JWT_SECRET: ${ssm:/taller/${self:provider.stage}/jwt-secret}
    CORS_ORIGINS: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
  apiGateway:
    usagePlan:
      - freeTier:
          quota:
            limit: 10000
            period: MONTH
          throttle:
            rateLimit: 10
            burstLimit: 20
    apiKeys:
      - freeTier:
          - ${self:provider.stage}-AmazonLite-DefaultKey
  iamRoleStatements:
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "*"

custom:
  cors:
    origin: ${self:provider.environment.CORS_ORIGINS}
    headers:
      - Content-Type
      - Authorization
      - X-Api-Key
      - X-Amz-Date
      - X-Amz-Security-Token
    allowCredentials: false

functions:
  ping:
    handler: src/handlers/ping.ping
    name: taller-${self:provider.stage}-Gateway-Ping
    events:
      - http:
          method: get
          path: /gateway/ping
          cors: ${self:custom.cors}

  authorizer:
    handler: src/handlers/authorizer.authorizer
    name: taller-${self:provider.stage}-Authorizer

resources:
  Resources:
    MainAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: taller-${self:provider.stage}-jwt-authorizer
        RestApiId:
          Ref: ApiGatewayRestApi
        Type: TOKEN
        IdentitySource: method.request.header.Authorization
        AuthorizerUri:
          Fn::Join:
            - ""
            - - "arn:aws:apigateway:"
              - Ref: AWS::Region
              - ":lambda:path/2015-03-31/functions/"
              - Fn::GetAtt:
                  - AuthorizerLambdaFunction
                  - Arn
              - "/invocations"
        AuthorizerResultTtlInSeconds: 0
    AuthorizerInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName:
          Fn::GetAtt:
            - AuthorizerLambdaFunction
            - Arn
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn:
          Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/authorizers/${MainAuthorizer}

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: UNAUTHORIZED
        StatusCode: "401"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: ACCESS_DENIED
        StatusCode: "403"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token'"

    GatewayResponseDefault4xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token'"

    GatewayResponseDefault5xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token'"

  Outputs:
    StageMainRestApiId:
      Value:
        Ref: ApiGatewayRestApi
      Export:
        Name: ${self:provider.stage}-MainRestApiId

    StageMainRestApiRootResourceId:
      Value:
        Fn::GetAtt:
          - ApiGatewayRestApi
          - RootResourceId
      Export:
        Name: ${self:provider.stage}-MainRestApiRootResourceId

    StageMainAuthorizerId:
      Value:
        Ref: MainAuthorizer
      Export:
        Name: ${self:provider.stage}-MainAuthorizerId

    # Solo para la primera actualizacion del Develop existente.
    MainRestApiId:
      Value:
        Ref: ApiGatewayRestApi
      Export:
        Name: MainRestApiId

    MainRestApiRootResourceId:
      Value:
        Fn::GetAtt:
          - ApiGatewayRestApi
          - RootResourceId
      Export:
        Name: MainRestApiRootResourceId

    MainAuthorizerId:
      Value:
        Ref: MainAuthorizer
      Export:
        Name: MainAuthorizerId
